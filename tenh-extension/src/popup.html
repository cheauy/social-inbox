<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TENH v1</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="../icons/icon-128.png" alt="" />
      <div>
        <h1>TENH v1</h1>
        <p class="version" id="version">—</p>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <span class="label">TENH</span>
        <span class="state" id="pairState">Checking…</span>
      </div>
      <p class="detail" id="deviceName"></p>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">Facebook</span>
        <span class="state" id="facebookState">Checking…</span>
      </div>
      <p class="detail" id="pageName"></p>
      <p class="detail" id="composerState"></p>

      <button id="signIn" class="primary" hidden>Sign in to Facebook</button>
      <button id="retry" hidden>Retry</button>
    </section>

    <section class="card" id="pairCard">
      <p class="detail">Sign in to TENH in this browser and it connects.</p>
      <button id="connect" class="primary">Open TENH</button>
      <p class="detail error" id="error"></p>
    </section>

    <section class="card" id="pairedCard" hidden>
      <label class="toggle" for="keepActive">
        <span>
          Keep Facebook companion active
          <span class="toggle-note" id="keepActiveNote"></span>
        </span>
        <input type="checkbox" id="keepActive" />
      </label>

      <button id="openTenh" class="primary">Open TENH Inbox</button>
      <button id="openFacebook">Open Facebook</button>
      <button id="unpair" class="danger">Disconnect this browser</button>
    </section>

    <section class="card">
      <p class="label">If something looks wrong</p>
      <button id="redetect">Re-detect Facebook</button>
      <button id="test">Test connection</button>
      <p class="detail" id="repairResult"></p>
    </section>

    <p class="footnote">
      Reads only what a Facebook tab already shows. Never touches Facebook
      passwords or cookies, and TENH works without it.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
