<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TENH v1</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="../icons/icon-128.png" alt="" />
      <div>
        <h1>TENH v1</h1>
        <p class="version" id="version">—</p>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <span class="label">TENH</span>
        <span class="state" id="connectionState">Checking…</span>
      </div>
      <p class="detail" id="deviceName"></p>
      <p class="detail" id="connectionHint"></p>
      <button id="openTenh" class="primary">Open TENH Inbox</button>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">Facebook</span>
        <span class="state" id="facebookState">Unknown</span>
      </div>
      <p class="detail" id="pageName">Facebook companion is idle</p>
      <p class="detail" id="composerState"></p>
      <button id="facebookAction" hidden>Sign in to Facebook</button>
    </section>

    <details class="card advanced">
      <summary>Advanced / Troubleshooting</summary>
      <button id="redetect">Re-detect Facebook</button>
      <button id="test">Test connection</button>
      <p class="detail" id="repairResult"></p>
    </details>

    <p class="footnote">
      TENH connects automatically when you are signed in at app.tenhchat.com.
      Normal TENH continues to work without this extension.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
